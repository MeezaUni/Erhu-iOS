name: MiniLMProbe
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
targets:
  MiniLMProbe:
    type: application
    platform: iOS
    sources:
      - ProbeApp.swift
      - Contract.swift
      - ../../../Erhu/Core/Common/Regex16.swift
      - ../../../Erhu/Core/Vybe/WordPieceTokenizer.swift
      - ../../../Erhu/Core/Vybe/CompactSentenceEmbedder.swift
      - path: ../../../Erhu/Resources/Vybe
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erhu.minilmprobe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    scheme:
      testTargets: [MiniLMProbeTests]
  MiniLMProbeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ProbeTests.swift
      - path: ../../../ErhuTests/Vybe/Fixtures/vybe-reference-vectors.json
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MiniLMProbe
