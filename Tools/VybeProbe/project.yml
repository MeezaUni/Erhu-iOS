name: VybeProbe
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
targets:
  Probe:
    type: application
    platform: iOS
    sources:
      - ProbeApp.swift
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erhu.vybeprobe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    scheme:
      testTargets: [ProbeTests]
  ProbeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ProbeTests.m]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Probe
