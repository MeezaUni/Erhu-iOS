name: Erhu
options:
  bundleIdPrefix: com.erhu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "3"
    ERHU_RELEASE_TAG: "v1.0-beta.3"
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ERHU_ANIMATED_ART"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  Ogg:
    url: https://github.com/sbooth/ogg-binary-xcframework
    revision: 48cbf24e7fb5d329b1f5e24cd2e5b048585ff770
  Opus:
    url: https://github.com/sbooth/opus-binary-xcframework
    revision: 8e23828b9d88f0ff1ff2d7c4bcb65739a4bdeff8
  Vorbis:
    url: https://github.com/sbooth/vorbis-binary-xcframework
    revision: 842020eabcebe410e698c68545d6597b2d232e51
targets:
  Erhu:
    type: application
    platform: iOS
    sources: [Erhu, Shared]
    dependencies:
      - target: ErhuWidgets
      - package: Ogg
        product: ogg
      - package: Opus
        product: opus
      - package: Vorbis
        product: vorbis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erhu
        SWIFT_OBJC_BRIDGING_HEADER: Support/Erhu-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/Erhu.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
    scheme:
      testTargets:
        - ErhuTests
        - ErhuInteractionTests
  ErhuWidgets:
    type: app-extension
    platform: iOS
    sources: [ErhuWidgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erhu.widgets
        PRODUCT_NAME: ErhuWidgets
        INFOPLIST_FILE: Support/ErhuWidgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/ErhuWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ERHU_WIDGET"
        APPLICATION_EXTENSION_API_ONLY: YES

  ErhuTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ErhuTests]
    dependencies:
      - target: Erhu
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  ErhuInteractionTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ErhuInteractionTests]
    dependencies:
      - target: Erhu
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Erhu
