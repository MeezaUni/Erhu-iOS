name: VYBE iOS compatibility probe
on:
  push:
    branches: [without-animated-art]
    paths: [Tools/VybeProbe/**, .github/workflows/vybe-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prior-diagnostics:
    if: contains(github.event.head_commit.message, '[diagnostic]')
    runs-on: ubuntu-latest
    steps:
      - name: Read the earlier owned-repository probe failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 41853296638 --repo MeezaUni/Erhu-iOS --log-failed > /tmp/prior-probe.log
          python3 - <<'PYREPORT'
          from pathlib import Path
          lines=Path('/tmp/prior-probe.log').read_text(errors='replace').splitlines()
          selected=[s for s in lines if any(k in s.lower() for k in ['error:', 'vybe_probe', 'failed', 'exception', 'could not', 'unable to', 'fatal'])]
          for line in (selected[-35:] or lines[-30:]):
              print('::notice title=Previous VYBE probe::'+line.replace('%','%25').replace('\n','%0A').replace('\r','%0D'))
          PYREPORT
  probe:
    if: "!contains(github.event.head_commit.message, '[diagnostic]')"
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Prepare official model and standalone probe
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          brew install xcodegen
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request, zipfile
          url='https://github.com/lochanpthakke/erhu/releases/download/v1.0.2-beta.1/vybe-embeddinggemma-300m-int4int8.zip'
          urllib.request.urlretrieve(url, '/tmp/vybe-model.zip')
          target=pathlib.Path('Tools/VybeProbe/Resources/embedding_gemma.task')
          target.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile('/tmp/vybe-model.zip') as archive:
              names=[name for name in archive.namelist() if name.endswith('embedding_gemma.task')]
              assert len(names)==1
              with archive.open(names[0]) as source, target.open('wb') as output:
                  while block:=source.read(1024*1024): output.write(block)
          assert hashlib.sha256(target.read_bytes()).hexdigest()=='913b7a1edc7c7c3d1da3979ec1d0648ed9e0a370f181bb59ab177ca4b97707ad'
          PY
          cd Tools/VybeProbe
          xcodegen generate
          pod install --repo-update
      - name: Test iOS runtime and retrieval
        run: |
          set -o pipefail
          RUNTIME=$(xcrun simctl list runtimes available -j | jq -r '[.runtimes[] | select(.platform == "iOS")] | sort_by(.version | split(".") | map(tonumber)) | last | .identifier // empty')
          if [ -z "$RUNTIME" ]; then
            xcodebuild -downloadPlatform iOS
            RUNTIME=$(xcrun simctl list runtimes available -j | jq -r '[.runtimes[] | select(.platform == "iOS")] | last | .identifier')
          fi
          TYPE=$(xcrun simctl list runtimes available -j | jq -r --arg runtime "$RUNTIME" '.runtimes[] | select(.identifier == $runtime) | [.supportedDeviceTypes[] | select(.productFamily == "iPhone")] | last | .identifier')
          DEVICE=$(xcrun simctl create "VYBE Probe" "$TYPE" "$RUNTIME")
          cd Tools/VybeProbe
          xcodebuild test -workspace VybeProbe.xcworkspace -scheme Probe -destination "id=$DEVICE" CODE_SIGNING_ALLOWED=NO -resultBundlePath Results.xcresult 2>&1 | tee probe.log
      - name: Publish public probe diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Tools/VybeProbe/probe.log')
          if p.exists():
              lines=p.read_text(errors='replace').splitlines()
              selected=[s for s in lines if 'VYBE_PROBE' in s or 'error:' in s or 'XCTAssert' in s or 'failed (' in s]
              import subprocess,json
              bundle=Path('Tools/VybeProbe/Results.xcresult')
              if bundle.exists():
                  result=subprocess.run(['xcrun','xcresulttool','get','test-results','summary','--path',str(bundle)],capture_output=True,text=True)
                  if result.returncode==0:
                      summary=json.loads(result.stdout)
                      selected += [json.dumps(f) for f in summary.get('testFailures',[])]
              selected += lines[-25:]
              for line in selected[:50]:
                  print('::notice title=VYBE iOS probe::'+line.replace('%','%25').replace('\n','%0A').replace('\r','%0D'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VYBE-iOS-probe
          path: |
            Tools/VybeProbe/probe.log
            Tools/VybeProbe/Results.xcresult
