name: Inspect native test evidence
on: push
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read saved native test logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run in 42455309061 42455311392; do
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name Erhu-test-results --dir "results/$run" || true
          done
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          for path in Path('results').rglob('regression-tests.log'):
              lines = path.read_text(errors='replace').splitlines()
              selected = [line for line in lines if re.search(r"Test Case .*?(?:LibraryInteractionTests|LibraryBrowseViewTests|ToolProgressTests|ArtworkUpgradeTests|MotionCoverAvailabilityTests|AutomaticArtistPhotosTests).*?(?:passed|failed)", line)]
              failures = []
              for index, line in enumerate(lines):
                  if re.search(r'Testing failed:|crash|unexpected exit|fatal error|signal|XCTAssert.*failed|error:', line, re.I):
                      failures.extend(lines[max(0,index-2):index+12])
              detail = str(path) + '\n' + '\n'.join(selected + failures + ['Last output:'] + lines[-90:])
              print(detail[-42000:])
              notice = str(path) + '\n' + '\n'.join(selected[-40:] + failures[-40:])
              print('::notice::' + notice[-18000:].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('```text\n' + detail[-42000:] + '\n```\n')
          PY
