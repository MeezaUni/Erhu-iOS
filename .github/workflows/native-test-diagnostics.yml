name: Inspect native test status
on: push
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read only test identifiers and fixed failure categories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run in 42455309061 42455311392; do
            if ! gh run download "$run" --repo "$GITHUB_REPOSITORY" --name Erhu-test-results --dir "results/$run" > "download-$run.log" 2>&1; then
              echo "Test artifact unavailable for run $run"
            fi
          done
          python3 - <<'PYDIAGNOSTIC'
          import re
          from pathlib import Path
          classes = '(?:LibraryInteractionTests|LibraryBrowseViewTests|ToolProgressTests|ArtworkUpgradeTests|MotionCoverAvailabilityTests|AutomaticArtistPhotosTests)'
          pattern = re.compile(r"Test Case '-\[(?:ErhuTests|ErhuInteractionTests)\.(" + classes + r") (test[A-Za-z0-9_]+)\]' (started|passed|failed)")
          categories = ['SIGABRT', 'SIGSEGV', 'Fatal error', 'Early unexpected exit', 'Testing failed:', 'test runner exited', 'crashed', 'Failed to launch', 'Failed to install', 'timed out', 'Could not cast value', 'Lost connection', 'Unable to boot', 'Simulator device failed']
          for run in ['42455309061', '42455311392']:
              records = {}
              flags = []
              for path in Path('results', run).rglob('regression-tests.log'):
                  log = path.read_text(errors='replace')
                  for name, method, state in pattern.findall(log): records[name + '.' + method] = state
                  flags += [category for category in categories if category.lower() in log.lower()]
              # Only alphanumeric Swift identifiers, fixed status words and fixed categories
              # leave this job. No raw log lines, paths, URLs, values or artifacts are published.
              summary = 'Run ' + run + '\n' + '\n'.join(['Failure category: ' + flag for flag in sorted(set(flags))] + [name + ': ' + state for name, state in records.items()])
              print('::notice::' + summary.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYDIAGNOSTIC
