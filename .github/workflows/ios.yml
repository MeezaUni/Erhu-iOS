name: iOS

on:
  push:
    paths-ignore:
      - "Tools/vybe_lab/**"
      - "Tools/VybeProbe/**"
      - ".github/workflows/vybe-probe.yml"
      - "docs/downloads/VYBE-training-kit.zip"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.deleted != true
    runs-on: macos-15-intel
    timeout-minutes: 75
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # The ogg, opus and vorbis binary packages download from GitHub release assets. When a
      # download fails (e.g. a 504), SwiftPM keeps the error body in its artifact cache and then
      # refuses to replace it ("already exists in file system"). Resolve with retries, clearing
      # that cache before each attempt; the build reuses the resolved packages.
      - name: Resolve Swift packages
        run: |
          mkdir -p build
          for attempt in 1 2 3 4 5; do
            rm -rf "$HOME/Library/Caches/org.swift.swiftpm/artifacts"
            if xcodebuild -resolvePackageDependencies -project Erhu.xcodeproj -scheme Erhu \
              -derivedDataPath build > build/resolve.log 2>&1; then
              exit 0
            fi
            echo "::warning::Swift package resolution attempt $attempt failed; retrying."
            sleep $((attempt * 30))
          done
          grep -i "error" build/resolve.log | head -20
          exit 1

      - name: Build unsigned IPA
        run: |
          set -o pipefail
          mkdir -p build
          if ! xcodebuild build -project Erhu.xcodeproj -scheme Erhu -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > build/compile.log 2>&1; then
            python3 - <<'PY'
          import os
          from pathlib import Path
          lines = Path('build/compile.log').read_text(errors='replace').splitlines()
          errors = [line for line in lines if 'error:' in line.lower()]
          for error in errors[:12]:
              escaped = error.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error::' + escaped, flush=True)
          detail = '\n'.join(errors or lines[-80:])[-24000:]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Build errors\n\n```text\n' + detail + '\n```\n')
          PY
            exit 1
          fi
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/Erhu.app dist/Payload/
          (cd dist && zip -qry Erhu.ipa Payload)

      - name: Report IPA and VYBE model size
        run: python3 Tools/report_app_size.py build/Build/Products/Release-iphoneos/Erhu.app dist/Erhu.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Erhu-ipa
          path: dist/Erhu.ipa
          if-no-files-found: error

      - name: Create iPhone simulator
        run: |
          newest_ios_runtime() {
            xcrun simctl list runtimes available -j | jq -r '
              [.runtimes[] | select(.platform == "iOS")]
              | sort_by(.version | split(".") | map(tonumber)) | last | .identifier // empty'
          }
          RUNTIME=$(newest_ios_runtime)
          if [ -z "$RUNTIME" ]; then
            echo "No iOS simulator runtime installed for this Xcode; downloading one."
            xcodebuild -downloadPlatform iOS
            RUNTIME=$(newest_ios_runtime)
          fi
          DEVICE_TYPE=$(xcrun simctl list runtimes available -j | jq -r --arg runtime "$RUNTIME" '
            .runtimes[] | select(.identifier == $runtime)
            | [.supportedDeviceTypes[] | select(.productFamily == "iPhone")] | last | .identifier')
          echo "Creating $DEVICE_TYPE on $RUNTIME"
          DEVICE=$(xcrun simctl create "CI iPhone" "$DEVICE_TYPE" "$RUNTIME")
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
          echo "SIMULATOR_RUNTIME=$RUNTIME" >> "$GITHUB_ENV"
          echo "SIMULATOR_DEVICE_TYPE=$DEVICE_TYPE" >> "$GITHUB_ENV"

      - name: Boot a clean simulator for native interactions
        run: |
          xcrun simctl shutdown "$SIMULATOR_ID" >/dev/null 2>&1 || true
          DEVICE=$(xcrun simctl create "CI UI iPhone" "$SIMULATOR_DEVICE_TYPE" "$SIMULATOR_RUNTIME")
          echo "UI_SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b > build/ui-boot.log 2>&1

      - name: Run native interaction checks
        run: |
          if ! xcodebuild test -project Erhu.xcodeproj -scheme Erhu \
            -destination "id=$UI_SIMULATOR_ID" -resultBundlePath build/InteractionResults.xcresult CODE_SIGNING_ALLOWED=NO \
            -only-testing:ErhuInteractionTests -parallel-testing-enabled NO > build/ui-tests.log 2>&1; then
            echo "::error::Native interaction checks failed; see the test-status report and result bundle."
            exit 1
          fi

      - name: Report native interaction status
        if: always()
        run: python3 Tools/report_native_interactions.py build/ui-tests.log

      - name: Release the UI simulator before unit testing
        if: always()
        run: |
          if [ -n "${UI_SIMULATOR_ID:-}" ]; then
            xcrun simctl shutdown "$UI_SIMULATOR_ID" >/dev/null 2>&1 || true
          fi

      - name: Run transfer and library regressions
        run: |
          set -o pipefail
          MOTION_TESTS=()
          if [ -f ErhuTests/AnimatedArtwork/MotionCoverDownloadsTests.swift ]; then
            MOTION_TESTS+=("-only-testing:ErhuTests/MotionCoverDownloadsTests")
          fi
          if ! xcodebuild test -project Erhu.xcodeproj -scheme Erhu \
            -destination "id=$SIMULATOR_ID" -resultBundlePath build/RegressionResults.xcresult CODE_SIGNING_ALLOWED=NO \
            -only-testing:ErhuTests/TransferListenerLifecycleTests \
            -only-testing:ErhuTests/TransferNetworkTests \
            -only-testing:ErhuTests/RadioHeroTests \
            -only-testing:ErhuTests/ArtworkThemeScopeTests \
            -only-testing:ErhuTests/ArtworkUpgradeTests \
            -only-testing:ErhuTests/AlbumArtworkTests \
            -only-testing:ErhuTests/AudioEngineTests \
            -only-testing:ErhuTests/TransitionResolverTests \
            -only-testing:ErhuTests/TransitionEditingTests \
            -only-testing:ErhuTests/BulkMetadataSelectionTests \
            -only-testing:ErhuTests/BulkMetadataApplyTests \
            -only-testing:ErhuTests/MetadataEnrichmentTests \
            -only-testing:ErhuTests/DiscogsGenresTests \
            -only-testing:ErhuTests/MotionCoverAvailabilityTests \
            -only-testing:ErhuTests/ReleaseAndDiscoveryTests \
            -only-testing:ErhuTests/LibrarySearchTests \
            -only-testing:ErhuTests/VybeNameLookupTests \
            -only-testing:ErhuTests/MetadataCompletenessTests \
            -only-testing:ErhuTests/LibraryBrowseTests \
            -only-testing:ErhuTests/LibraryBrowseHistoryTests \
            -only-testing:ErhuTests/LibraryBrowseViewTests \
            -only-testing:ErhuTests/PlayerDragStateTests \
            -only-testing:ErhuTests/LibraryChromeTests \
            -only-testing:ErhuTests/ToolProgressTests \
            -only-testing:ErhuTests/AutomaticArtistPhotosTests \
            -parallel-testing-enabled NO \
            -only-testing:ErhuTests/LibraryModelBuilderTests "${MOTION_TESTS[@]}" > build/regression-tests.log 2>&1; then
            python3 - <<'PYREGRESSION'
          import os, re
          from pathlib import Path
          lines = Path('build/regression-tests.log').read_text(errors='replace').splitlines()
          failures = []
          for index, line in enumerate(lines):
              if re.search(r'error:|XCTAssert.*failed|Test [Cc]ase .* failed|Testing failed:|\*\* TEST FAILED', line):
                  detail = [line]
                  if 'caught error:' in line:
                      detail += lines[index + 1:index + 7]
                  failures.append('\n'.join(detail))
          for line in (failures or lines[-30:])[:60]:
              print('::error::' + line[-5000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Transfer/library regressions\n\n```text\n' + '\n'.join((failures + lines[-50:]))[-24000:] + '\n```\n')
          PYREGRESSION
            exit 1
          fi

      - name: Run unit tests
        run: |
          set -o pipefail
          if ! xcodebuild test -project Erhu.xcodeproj -scheme Erhu \
            -destination "id=$SIMULATOR_ID" -resultBundlePath build/TestResults.xcresult CODE_SIGNING_ALLOWED=NO -skip-testing:ErhuInteractionTests \
            > build/tests.log 2>&1; then
            python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          lines = Path('build/tests.log').read_text(errors='replace').splitlines()
          def is_failure(line):
              # Media fixtures deliberately produce system diagnostics. Report test/compiler
              # failures, including Xcode's parallel runner, without promoting those to errors.
              return (re.search(r'\.(?:swift|m|mm|h):\d+(?::\d+)?:\s*(?:fatal )?error:', line) is not None
                      or line.lstrip().startswith(('error:', 'fatal error:', 'xcodebuild: error:', 'Testing failed:'))
                      or ('XCTAssert' in line and 'failed' in line)
                      or re.search(r'Test [Cc]ase .* failed(?: on | \()', line) is not None
                      or (line.startswith('Test Suite ') and ' failed at ' in line)
                      or '** TEST FAILED **' in line)
          failures = [line for line in lines if is_failure(line)]
          result_detail = []
          bundle = Path('build/TestResults.xcresult')
          if bundle.exists():
              commands = [
                  ['xcrun', 'xcresulttool', 'get', 'test-results', 'summary', '--path', str(bundle)],
                  ['xcrun', 'xcresulttool', 'get', 'object', '--legacy', '--path', str(bundle), '--format', 'json'],
              ]
              for command in commands:
                  try:
                      result = subprocess.run(command, capture_output=True, text=True, timeout=30)
                      if result.returncode:
                          result_detail.append(result.stderr[-2000:])
                          continue
                      data = json.loads(result.stdout)
                      if 'testFailures' in data:
                          result_detail.append(result.stdout[-18000:])
                          for failure in data.get('testFailures') or []:
                              name = failure.get('testName') or failure.get('testIdentifier') or 'Test failure'
                              failures.append(str(name) + ': ' + str(failure.get('failureText') or failure))
                      else:
                          for category in ['testFailureSummaries', 'errorSummaries']:
                              for issue in data.get('issues', {}).get(category, {}).get('_values', []):
                                  name = issue.get('testCaseName', {}).get('_value', 'Test runner')
                                  message = issue.get('message', {}).get('_value', '')
                                  if message:
                                      failures.append(name + ': ' + message)
                  except (OSError, ValueError, subprocess.TimeoutExpired) as error:
                      result_detail.append(str(error))
          failures = list(dict.fromkeys(failures))
          for failure in failures[:30]:
              escaped = failure.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error::' + escaped, flush=True)
          detail = '\n'.join(failures + result_detail + ['Last test output:'] + lines[-100:])[-40000:]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Test errors\n\n```text\n' + detail + '\n```\n')
          PY
            exit 1
          fi

      - name: Upload test results and performance measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Erhu-test-results
          path: |
            build/TestResults.xcresult
            build/RegressionResults.xcresult
            build/InteractionResults.xcresult
            build/ui-tests.log
            build/ui-boot.log
            build/regression-tests.log
            build/tests.log
            build/compile.log
          if-no-files-found: warn
